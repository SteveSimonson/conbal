name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate contracts
        run: npm run validate
        env:
          CONBAL_ALLOW_PLACEHOLDER_BINDINGS: "1"

      - name: Check Worker syntax
        run: node --check workers/site.js

      - name: Test delivery contracts
        run: npm test
