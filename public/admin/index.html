<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conbal dashboard</title><style>body{max-width:1000px;margin:30px auto;padding:0 18px;font:16px system-ui;color:#172033}header{display:flex;align-items:center;justify-content:space-between;gap:16px}input,textarea,select,button{box-sizing:border-box;padding:9px;margin:4px 0}input,textarea,select{width:100%}textarea{min-height:100px}button{cursor:pointer}.site,.balloon{border:1px solid #d8dfeb;border-radius:9px;padding:14px;margin:12px 0}code{background:#f2f4f8;padding:5px;word-break:break-all}pre{white-space:pre-wrap}.editor{max-width:720px}.editor iframe{display:block;width:100%;min-height:180px;border:1px solid #d8dfeb;background:#fff}.import{margin-top:20px;padding-top:8px;border-top:1px solid #d8dfeb}.import h3{margin-bottom:0}.help{color:#5c6677;font-size:.9em}#message{min-height:1.5em;color:#9c2c2c}</style></head><body><header><h1>Conbal dashboard</h1><button type="button" id="logout">Log out</button></header><p id="message" role="status"></p><form id="new-site"><label>New site <input name="name" required maxlength="120" placeholder="Your website name"></label><button>Create site</button></form><main id="sites"></main><script type="module" src="/admin/app.js"></script></body></html>
