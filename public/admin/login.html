<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conbal login</title><style>body{max-width:360px;margin:10vh auto;font:16px system-ui}input,button{box-sizing:border-box;width:100%;padding:10px;margin:6px 0}#message{color:#b42318}</style><h1>Conbal</h1><p id="message"></p><form id="auth"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (8+ characters)" required><input name="inviteCode" placeholder="Invite code (if required)"><button name="action" value="login">Log in</button><button name="action" value="signup">Create account</button></form><script>document.querySelector('#auth').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/'+e.submitter.value,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});if(r.ok)location='/admin/';else document.querySelector('#message').textContent=(await r.json()).error||'Something went wrong';}</script>
